name: Validate and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save ajv@8 ajv-formats@3
      - run: node scripts/validate.mjs
      - run: npm ci --no-audit --no-fund
        working-directory: mcp
      - run: npm test
        working-directory: mcp

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble site
        run: |
          node scripts/build-llms.mjs
          mkdir -p _site/schemas/0.1 _site/examples
          cp -R site/. _site/
          rm -f _site/og-source.html
          cp SPEC.md _site/spec.md
          cp skills/velopair/SKILL.md _site/skill.md
          cp AGENTS.md _site/agents.md
          cp schemas/*.schema.json _site/schemas/0.1/
          cp -R examples/endurance-gravel examples/fast-road _site/examples/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
