<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #10171C;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    position: relative; color: #E9EEEC;
  }
  .rings { position: absolute; top: 70px; left: 84px; }
  .card { position: absolute; left: 84px; top: 208px; }
  .wordmark { font-size: 118px; font-weight: 700; letter-spacing: -0.025em; color: #FAFAF7; line-height: 1; }
  .wordmark b { color: #5CBFB2; font-weight: 700; }
  .tagline { margin-top: 30px; font-size: 40px; font-weight: 400; color: #9BAAB3; max-width: 860px; line-height: 1.3; }
  .foot {
    position: absolute; left: 84px; bottom: 64px; display: flex; align-items: center; gap: 26px;
    font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    font-size: 24px; letter-spacing: .12em; text-transform: uppercase; color: #7A8B87;
  }
  .foot i { display: inline-block; width: 70px; height: 10px; border-bottom: 1px solid #263540; border-left: 1px solid #263540; border-right: 1px solid #263540; }
  .score {
    position: absolute; right: 84px; top: 84px;
    font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    font-size: 26px; color: #9AD6CC; background: rgba(92,191,178,.12);
    border-left: 4px solid #5CBFB2; padding: 14px 22px; line-height: 1.5;
  }
  .score .k { color: #E9EEEC; } .score .n { color: #D9A55C; }
</style>
</head>
<body>
  <svg class="rings" width="176" height="96" viewBox="0 0 176 96">
    <circle cx="48" cy="48" r="42" fill="none" stroke="#5CBFB2" stroke-width="9"/>
    <circle cx="128" cy="48" r="42" fill="none" stroke="#FAFAF7" stroke-width="9" opacity="0.9"/>
  </svg>
  <div class="card">
    <div class="wordmark">velo<b>pair</b></div>
    <div class="tagline">Riders and bikes, in a language any app can read.</div>
  </div>
  <div class="foot"><span>velopair.org</span><i></i><span>open data standard</span><i></i><span>v0.1.0</span></div>
  <div class="score"><span class="k">"score"</span>: <span class="n">91</span></div>
</body>
</html>
